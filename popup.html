<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 290px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #e5e7eb; background: #111827; }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14px; }
    h2 { margin: 14px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9ca3af; }
    label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
    select, input[type=range] { width: 140px; }
    input[type=color] { width: 44px; height: 24px; padding: 0; border: 0; background: none; }
    #preview { margin: 10px 0 2px; padding: 8px; text-align: center; background: #374151; border-radius: 6px; }
    #preview .orig { color: #fff; }
    #preview .tran { display: inline-block; margin-top: 3px; padding: 1px 6px; border-radius: 4px; }
    a.button { display: block; margin-top: 12px; padding: 8px; text-align: center; color: #fff; text-decoration: none; background: #4f46e5; border-radius: 6px; }
    small { color: #9ca3af; display: block; margin-top: 10px; line-height: 1.4; }
    footer { margin-top: 10px; font-size: 11px; color: #6b7280; }
    footer a { color: #a5b4fc; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" width="18" height="18"> Dual Subtitles</h1>
  <label>Bật <input type="checkbox" id="enabled"></label>
  <label>Dịch sang
    <select id="lang">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
      <option value="zh-CN">中文 (giản thể)</option>
      <option value="zh-TW">中文 (phồn thể)</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="th">ไทย</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>
  </label>

  <h2>Giao diện</h2>
  <label>Vị trí bản dịch
    <select id="position"><option value="below">Dưới bản gốc</option><option value="above">Trên bản gốc</option></select>
  </label>
  <label>Cỡ chữ <input type="range" id="fontSize" min="60" max="160" step="10"></label>
  <label>Màu chữ <input type="color" id="color"></label>
  <label>Độ đậm nền <input type="range" id="background" min="0" max="100" step="5"></label>
  <label>Chữ đậm <input type="checkbox" id="bold"></label>
  <label>Chỉ hiện bản dịch <input type="checkbox" id="hideOriginal"></label>
  <div id="preview"><div class="orig">Welcome back to the course.</div><span class="tran">Chào mừng bạn quay lại khóa học.</span></div>

  <h2>Học từ vựng</h2>
  <a class="button" href="vocabulary.html" target="_blank">Sổ từ vựng (<span id="count">0</span>)</a>
  <small>Bật phụ đề gốc bằng nút CC của trình phát. Bôi đen một từ trên phụ đề gốc để tra nghĩa và lưu vào sổ.</small>
  <footer>Làm bởi <a href="https://github.com/ledtudev" target="_blank" rel="noopener">muckhotieu</a> · mã nguồn mở MIT</footer>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
