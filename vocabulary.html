<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Sổ từ vựng · Dual Subtitles</title>
  <style>
    body { max-width: 900px; margin: 0 auto; padding: 24px 16px; font: 14px system-ui, sans-serif; color: #e5e7eb; background: #111827; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    h1 { flex: 1; margin: 0; font-size: 20px; }
    input[type=search] { padding: 7px 10px; width: 220px; color: inherit; background: #1f2937; border: 1px solid #374151; border-radius: 6px; }
    button { padding: 7px 12px; color: #fff; background: #4f46e5; border: 0; border-radius: 6px; cursor: pointer; }
    button.ghost { background: #374151; }
    .item { padding: 12px 14px; margin-bottom: 8px; background: #1f2937; border-radius: 8px; }
    .word { font-size: 16px; font-weight: 600; color: #ffd84d; }
    .meaning { margin-left: 8px; }
    .context { margin-top: 6px; color: #9ca3af; font-size: 13px; }
    .meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #6b7280; }
    .meta a { color: #a5b4fc; }
    .meta button { padding: 2px 8px; font-size: 12px; background: #7f1d1d; }
    #empty { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>Sổ từ vựng (<span id="count">0</span>)</h1>
    <input type="search" id="search" placeholder="Tìm từ…">
    <button id="csv">Xuất CSV (Anki)</button>
    <button id="clear" class="ghost">Xoá hết</button>
  </header>
  <p id="empty" hidden>Chưa có từ nào. Bôi đen một từ trên phụ đề gốc rồi bấm “Lưu vào sổ từ”.</p>
  <div id="list"></div>
  <script src="vocabulary.js"></script>
</body>
</html>
